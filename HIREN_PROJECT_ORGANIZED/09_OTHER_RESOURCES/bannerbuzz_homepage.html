                <!-- ===== THREE.JS SCRIPT ===== -->
                <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
                <script>
                    // Initialize Three.js Scene
                    const container = document.getElementById('canvas-container');
                    if (container) {
                        const scene = new THREE.Scene();
                        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
                        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

                        renderer.setSize(container.clientWidth, container.clientHeight);
                        renderer.setClearColor(0x0f172a, 0.1);
                        container.appendChild(renderer.domElement);

                        // Create rotating 3D banner cube
                        const geometry = new THREE.BoxGeometry(2, 3, 0.5);
                        const material = new THREE.MeshPhongMaterial({
                            color: 0xff6b35,
                            emissive: 0xff6b35,
                            shininess: 100
                        });
                        const banner = new THREE.Mesh(geometry, material);
                        scene.add(banner);

                        // Add lighting
                        const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
                        light1.position.set(5, 5, 5);
                        scene.add(light1);

                        const light2 = new THREE.PointLight(0x0ea5e9, 0.5);
                        light2.position.set(-5, 5, 0);
                        scene.add(light2);

                        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                        scene.add(ambientLight);

                        camera.position.z = 5;

                        // Animation loop
                        function animate() {
                            requestAnimationFrame(animate);
                            banner.rotation.x += 0.005;
                            banner.rotation.y += 0.008;
                            banner.position.y = Math.sin(Date.now() * 0.0005) * 0.5;
                            renderer.render(scene, camera);
                        }

                        animate();

                        // Handle window resize
                        window.addEventListener('resize', () => {
                            const width = container.clientWidth;
                            const height = container.clientHeight;
                            camera.aspect = width / height;
                            camera.updateProjectionMatrix();
                            renderer.setSize(width, height);
                        });
                    }

                    // Dropdown functionality
                    document.querySelectorAll('.nav-item').forEach(item => {
                        item.addEventListener('mouseenter', () => {
                            item.querySelector('.dropdown-content')?.classList.remove('hidden');
                        });
                        item.addEventListener('mouseleave', () => {
                            item.querySelector('.dropdown-content')?.classList.add('hidden');
                        });
                    });

                    // Smooth scroll for carousel
                    document.querySelectorAll('.carousel-container').forEach(carousel => {
                        let isScrolling = false;
                        carousel.addEventListener('wheel', (e) => {
                            if (!isScrolling) {
                                e.preventDefault();
                                isScrolling = true;
                                carousel.scrollLeft += e.deltaY;
                                setTimeout(() => isScrolling = false, 50);
                            }
                        });
                    });
                </script>
