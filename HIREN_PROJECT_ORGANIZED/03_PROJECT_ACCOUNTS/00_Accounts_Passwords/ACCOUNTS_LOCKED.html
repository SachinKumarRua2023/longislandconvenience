<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔐 Accounts Vault — SeekHowItHRua</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
      --text: #e6edf3;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    /* ── LOCK SCREEN ── */
    #lock-screen {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1a1f2e 0%, #0d1117 70%);
    }
    .lock-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%; max-width: 440px;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }
    .lock-icon {
      font-size: 56px; margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .lock-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .lock-card .sub { font-size: 13px; color: var(--muted); margin-bottom: 32px; line-height: 1.5; }
    .input-wrap { position: relative; margin-bottom: 16px; }
    .input-wrap input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 48px 14px 16px;
      color: var(--text); font-size: 16px;
      outline: none; transition: border-color .2s;
      letter-spacing: 2px;
    }
    .input-wrap input:focus { border-color: var(--accent); }
    .input-wrap input.error { border-color: var(--red); animation: shake .35s ease; }
    .input-wrap input.success { border-color: var(--green); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px;
      color: var(--muted); transition: color .2s;
    }
    .eye-btn:hover { color: var(--text); }
    .unlock-btn {
      width: 100%; padding: 14px;
      background: var(--accent);
      border: none; border-radius: 10px;
      color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .unlock-btn:hover { background: #79b8ff; transform: translateY(-1px); }
    .unlock-btn:active { transform: translateY(0); }
    .unlock-btn:disabled { background: var(--border); cursor: not-allowed; transform: none; }
    .error-msg {
      color: var(--red); font-size: 13px; margin-top: 12px;
      display: none; align-items: center; justify-content: center; gap: 6px;
    }
    .attempts-left { font-size: 11px; color: var(--muted); margin-top: 10px; }
    .lock-footer { font-size: 11px; color: var(--muted); margin-top: 32px; line-height: 1.6; }
    .lock-footer strong { color: var(--yellow); }
    .progress-bar {
      height: 3px; background: var(--border); border-radius: 2px;
      margin-top: 16px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0; background: var(--accent);
      border-radius: 2px; transition: width .4s ease;
    }

    /* ── VAULT CONTENT ── */
    #vault { display: none; }
    .vault-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 28px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      position: sticky; top: 0; z-index: 100;
    }
    .vault-header-left { display: flex; align-items: center; gap: 12px; }
    .vault-header-left h1 { font-size: 16px; font-weight: 700; color: var(--green); }
    .vault-header-left p { font-size: 12px; color: var(--muted); }
    .header-actions { display: flex; gap: 8px; }
    .hbtn {
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: 8px; padding: 7px 14px;
      font-size: 12px; cursor: pointer; transition: all .2s;
    }
    .hbtn:hover { border-color: var(--accent); color: var(--accent); }
    .hbtn.danger:hover { border-color: var(--red); color: var(--red); }

    /* Search */
    .vault-search {
      padding: 16px 28px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    .vault-search input {
      width: 100%; max-width: 500px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
      color: var(--text); font-size: 14px; outline: none;
    }
    .vault-search input:focus { border-color: var(--accent); }

    /* Markdown content */
    #md-output {
      max-width: 960px; margin: 0 auto;
      padding: 32px 28px 60px;
    }
    #md-output h1 { font-size: 24px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin: 28px 0 16px; }
    #md-output h2 { font-size: 18px; color: var(--text); margin: 28px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
    #md-output h3 { font-size: 15px; color: var(--yellow); margin: 20px 0 10px; }
    #md-output p { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 12px; }
    #md-output blockquote {
      border-left: 3px solid var(--yellow);
      padding: 10px 16px; margin: 16px 0;
      background: rgba(210,153,34,.08); border-radius: 0 8px 8px 0;
      font-size: 13px; color: var(--yellow);
    }
    #md-output table {
      width: 100%; border-collapse: collapse;
      margin: 16px 0; font-size: 13px;
      background: var(--surface);
      border-radius: 8px; overflow: hidden;
    }
    #md-output th {
      background: var(--surface2); color: var(--accent);
      padding: 10px 14px; text-align: left;
      font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
    }
    #md-output td {
      padding: 9px 14px; border-top: 1px solid var(--border);
      color: var(--text);
    }
    #md-output tr:hover td { background: var(--surface2); }
    #md-output code {
      background: var(--surface2); padding: 2px 6px;
      border-radius: 4px; font-family: 'Courier New', monospace;
      font-size: 12px; color: var(--green);
    }
    #md-output hr {
      border: none; border-top: 1px solid var(--border);
      margin: 28px 0;
    }
    #md-output strong { color: var(--text); font-weight: 600; }
    #md-output em { color: var(--muted); font-style: italic; }

    /* Copy cell */
    td .copy-val {
      background: none; border: none;
      color: var(--muted); cursor: pointer; font-size: 11px;
      padding: 2px 5px; border-radius: 3px;
      transition: color .15s;
    }
    td .copy-val:hover { color: var(--accent); }
    td .copy-val.ok { color: var(--green); }

    /* Highlight search */
    mark { background: rgba(210,153,34,.25); color: var(--yellow); border-radius: 2px; padding: 0 1px; }

    /* Section nav */
    .section-nav {
      position: fixed; right: 20px; top: 50%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 6px;
    }
    .section-nav a {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); display: block;
      transition: all .2s; cursor: pointer;
    }
    .section-nav a:hover { background: var(--accent); width: 10px; height: 10px; }

    @media(max-width:600px){
      .lock-card { padding: 32px 20px; }
      .vault-header, .vault-search, #md-output { padding-left: 16px; padding-right: 16px; }
      .section-nav { display: none; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════ LOCK SCREEN ═══════════════════════════ -->
<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon" id="lock-icon">🔐</div>
    <h1>Accounts Vault</h1>
    <p class="sub">Client: Hiren Kumar &nbsp;·&nbsp; SeekHowItHRua<br>Enter the vault password to access credentials.</p>

    <div class="input-wrap">
      <input type="password" id="pw-input" placeholder="Enter vault password…" autocomplete="off" autofocus/>
      <button class="eye-btn" id="eye-btn" onclick="toggleEye()" title="Show/hide password">👁️</button>
    </div>
    <button class="unlock-btn" id="unlock-btn" onclick="tryUnlock()">Unlock Vault</button>
    <div class="error-msg" id="error-msg">⚠️ <span id="error-text">Incorrect password</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="attempts-left" id="attempts-left"></div>

    <div class="lock-footer">
      <strong>⚠️ Confidential</strong><br>
      Authorised access only. Managed by <strong>SeekHowItHRua</strong>.<br>
      Share only with Hiren Kumar directly.
    </div>
  </div>
</div>

<!-- ═══════════════════════════ VAULT ═══════════════════════════ -->
<div id="vault">
  <div class="vault-header">
    <div class="vault-header-left">
      <span style="font-size:22px">🔓</span>
      <div>
        <h1>Accounts Vault — Unlocked</h1>
        <p id="unlock-time"></p>
      </div>
    </div>
    <div class="header-actions">

      <button class="hbtn danger" onclick="lockVault()">🔐 Lock</button>
    </div>
  </div>
  <div class="vault-search">
    <input type="text" id="vault-search" placeholder="Search accounts, platforms, emails, URLs…" oninput="doSearch()" />
  </div>
  <div id="md-output"></div>
</div>

const PW_HASH = "bSVJuY3JkYw8HJPJKNDfSqwc5KC7F9H4z99ITzonk/U=";

let attempts = 0;
const MAX_ATTEMPTS = 10;

// ─── Helpers ───
function b64ToBytes(b64) {
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return new Uint8Array(buf);
}
function bytesToB64(bytes) {
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

// ─── Toggle password visibility ───
function toggleEye() {
  const inp = document.getElementById('pw-input');
  const btn = document.getElementById('eye-btn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁️'; }
}

// ─── Unlock ───
async function tryUnlock() {
  const pw = document.getElementById('pw-input').value;
  if (!pw) return;

  const btn = document.getElementById('unlock-btn');
  btn.disabled = true; btn.textContent = 'Verifying…';

  const verifyHash = await sha256(pw + '::hiren-verify');
  const verifyB64 = bytesToB64(verifyHash);

  if (verifyB64 !== PW_HASH) {
    attempts++;
    const inp = document.getElementById('pw-input');
    inp.classList.add('error');
    setTimeout(() => inp.classList.remove('error'), 500);
    const errEl = document.getElementById('error-msg');
    const remaining = MAX_ATTEMPTS - attempts;
    document.getElementById('error-text').textContent =
      remaining > 0 ? `Incorrect password. ${remaining} attempts remaining.` : 'Vault locked — too many attempts.';
    errEl.style.display = 'flex';
    document.getElementById('progress-fill').style.width = (attempts / MAX_ATTEMPTS * 100) + '%';
    if (attempts >= MAX_ATTEMPTS) {
      btn.textContent = 'Vault Locked';
      document.getElementById('pw-input').disabled = true;
    } else {
      btn.disabled = false; btn.textContent = 'Unlock Vault';
    }
    document.getElementById('pw-input').value = '';
    return;
  }

  // Correct — derive XOR key and decrypt
  const keyBytes = await sha256(pw);
  const cipherBytes = b64ToBytes(PAYLOAD);
  const plain = new Uint8Array(cipherBytes.length);
  for (let i = 0; i < cipherBytes.length; i++) plain[i] = cipherBytes[i] ^ keyBytes[i % keyBytes.length];
  const markdown = new TextDecoder().decode(plain);

  // Show vault
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('vault').style.display = 'block';
  document.getElementById('unlock-time').textContent =
    'Unlocked at ' + new Date().toLocaleTimeString() + ' — Session active';
  document.getElementById('md-output').innerHTML = renderMd(markdown);
  addCopyButtons();
}

// ─── Enter key support ───
document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryUnlock();
});

// ─── Lock vault ───
function lockVault() {
  document.getElementById('vault').style.display = 'none';
  document.getElementById('lock-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-input').disabled = false;
  document.getElementById('unlock-btn').disabled = false;
  document.getElementById('unlock-btn').textContent = 'Unlock Vault';
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('lock-icon').textContent = '🔐';
  attempts = 0;
}

// ─── Print ───
function printVault() { window.print(); }

// ─── Simple Markdown renderer ───
function renderMd(md) {
  let html = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // headings
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // blockquote
    .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
    // hr
    .replace(/^---$/gm, '<hr>')
    // bold
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    // italic
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // code inline
    .replace(/`([^`]+)`/g, '<code>$1</code>');

  // Tables
  html = html.replace(/((?:^\|.+\|\n?)+)/gm, match => {
    const rows = match.trim().split('\n');
    if (rows.length < 2) return match;
    let out = '<table>';
    rows.forEach((row, i) => {
      if (/^\|[\s\-|]+\|$/.test(row)) return; // separator
      const cells = row.split('|').filter((_, idx, arr) => idx > 0 && idx < arr.length - 1);
      const tag = i === 0 ? 'th' : 'td';
      out += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
    });
    return out + '</table>';
  });

  // Paragraphs (lines not already wrapped)
  html = html.split('\n').map(line => {
    if (!line.trim()) return '';
    if (/^<(h[1-6]|blockquote|hr|table|tr|th|td)/.test(line)) return line;
    return '<p>' + line + '</p>';
  }).join('\n');

  return html;
}

// ─── Add copy buttons to table cells with values ───
function addCopyButtons() {
  document.querySelectorAll('#md-output td').forEach(td => {
    const txt = td.textContent.trim();
    if (!txt || txt === '[PASSWORD]' || txt === '[EMAIL]' || txt === '[KEY]' || txt.startsWith('[')) return;
    if (txt.length < 4) return;
    const btn = document.createElement('button');
    btn.className = 'copy-val'; btn.textContent = ' ⧉';
    btn.title = 'Copy value';
    btn.onclick = () => {
      navigator.clipboard.writeText(txt).then(() => {
        btn.textContent = ' ✓'; btn.classList.add('ok');
        setTimeout(() => { btn.textContent = ' ⧉'; btn.classList.remove('ok'); }, 1500);
      });
    };
    td.appendChild(btn);
  });
}

// ─── Search in vault ───
function doSearch() {
  const term = document.getElementById('vault-search').value.trim().toLowerCase();
  document.querySelectorAll('mark').forEach(m => {
    const t = document.createTextNode(m.textContent);
    m.parentNode.replaceChild(t, m);
  });
  if (!term) return;
  const walker = document.createTreeWalker(document.getElementById('md-output'), NodeFilter.SHOW_TEXT, null, false);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const idx = node.nodeValue.toLowerCase().indexOf(term);
    if (idx === -1) return;
    const span = document.createElement('span');
    span.innerHTML = node.nodeValue.substring(0, idx) +
      '<mark>' + node.nodeValue.substring(idx, idx + term.length) + '</mark>' +
      node.nodeValue.substring(idx + term.length);
    node.parentNode.replaceChild(span, node);
  });
  // Scroll to first match
  const first = document.querySelector('mark');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Ctrl+F shortcut inside vault
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f' && document.getElementById('vault').style.display !== 'none') {
    e.preventDefault();
    document.getElementById('vault-search').focus();
  }
});
